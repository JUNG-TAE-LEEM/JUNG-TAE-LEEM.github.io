<!-- 이 파일은 사람이 손으로 관리한다(빌드 산출물이 아니다).
     깃헙 페이지는 없는 주소를 만나면 뿌리의 `/404.html` 하나를 보여 준다. 그러므로 —

<style>

  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         padding: 2rem 1.5rem; background: var(--paper); color: var(--ink);

  .seal { display: inline-grid; place-items: center; width: 3.25rem; height: 3.25rem;
          border-radius: .75rem; background: var(--celadon); color: var(--paper);
          font-family: "Nanum Myeongjo", Batang, 바탕, serif; font-size: 1.75rem;
          line-height: 1; padding-bottom: .1rem; }
  h1 { font-family: "Nanum Myeongjo", Batang, 바탕, serif; font-weight: 400;
       font-size: 1.5rem; margin: 1.5rem 0 .5rem; letter-spacing: -.01em; }
  p { margin: 0 0 .35rem; color: var(--ink-soft); font-size: .9375rem; }
  p.en { color: var(--ink-mute); font-size: .875rem; }
  ul { list-style: none; padding: 0; margin: 2rem 0 0; border-top: 1px solid var(--rule); }
  li { border-bottom: 1px solid var(--rule); }
  a { display: flex; gap: 1rem; align-items: baseline; padding: .9rem .25rem;
      color: var(--celadon); text-decoration: none; font-size: .9375rem; }
  a:hover { background: color-mix(in srgb, var(--celadon) 8%, transparent); }
  a span { color: var(--ink-mute); font-size: .8125rem; }
  footer { margin-top: 2rem; font-size: .75rem; color: var(--ink-mute); }
</style>
